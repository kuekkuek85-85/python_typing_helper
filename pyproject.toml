[project]
name = "python-typing-helper"
version = "0.8.0"
description = "중학교 1학년 정보 교과용 파이썬 타자 연습 웹 애플리케이션"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.1",
    "werkzeug>=3.1.3",
    "gunicorn>=23.0.0",
    "firebase-admin>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
