<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낱말 슈팅 - 파이썬 타자 도우미</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="{{ url_for('index') }}" class="navbar-brand">
                <i class="bi bi-arrow-left"></i>
                파이썬 타자 도우미
            </a>
            <span class="badge bg-danger">🚀 낱말 슈팅</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <!-- HUD -->
                <div class="d-flex justify-content-between align-items-center mb-2 game-hud">
                    <div><span class="text-muted">점수</span> <strong id="gameScore">0</strong></div>
                    <div><span class="text-muted">콤보</span> <strong id="gameCombo">0</strong></div>
                    <div><span class="text-muted">최고</span> <strong id="gameBest">0</strong></div>
                    <div><span class="text-muted">생명</span> <strong id="gameLives">❤️❤️❤️</strong></div>
                </div>

                <!-- 게임 영역 -->
                <div id="gameArea" class="game-area">
                    <!-- 떨어지는 낱말이 여기에 생긴다 -->

                    <!-- 시작/게임오버 오버레이 -->
                    <div id="gameOverlay" class="game-overlay">
                        <div class="text-center">
                            <h3 id="overlayTitle" class="mb-2">🚀 낱말 슈팅</h3>
                            <p id="overlayText" class="text-muted mb-3">
                                위에서 떨어지는 <strong>파이썬 낱말</strong>을 타이핑해 맞히세요!<br>
                                바닥에 닿으면 생명이 줄어듭니다. 빠를수록 콤보가 쌓여요.
                            </p>
                            <button id="startBtn" class="btn btn-danger btn-lg">
                                <i class="bi bi-play-fill"></i> 시작하기
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 입력창 -->
                <div class="mt-3">
                    <input type="text" id="gameInput" class="form-control form-control-lg text-center"
                           placeholder="여기에 낱말을 입력하세요"
                           autocomplete="off" spellcheck="false" lang="en" inputmode="latin" disabled>
                </div>

                <p class="text-muted small mt-3 mb-0">
                    <i class="bi bi-info-circle"></i>
                    재미용 게임입니다. 점수는 명예의 전당(연습 순위)과는 별개이며, 최고 점수는 이 브라우저에만 저장됩니다.
                </p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.js') }}"></script>
    <script>
        // 떨어질 낱말 풀(파이썬 키워드·함수·터틀 메서드). content.GAME_WORDS에서 내려온다.
        window.gameWords = {{ words | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/game_word_shooter.js') }}"></script>
</body>
</html>
