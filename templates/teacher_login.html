<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 로그인 · 파이썬 타자 도우미</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 420px;">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h1 class="h4 mb-4 text-center">
                    <i class="bi bi-mortarboard-fill text-primary"></i>
                    교사 대시보드
                </h1>

                {% if error %}
                <div class="alert alert-danger py-2" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> {{ error }}
                </div>
                {% endif %}

                <form method="post" action="{{ url_for('teacher_login') }}">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control mb-3" id="password" name="password"
                           autocomplete="current-password" autofocus required>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> 로그인
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="text-muted small">← 홈으로</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
